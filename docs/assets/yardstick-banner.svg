<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Yardstick: measure a yard with a phone, and know how far to trust it.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f5b342" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="#141210"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <!-- wordmark -->
  <text x="96" y="176" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="-3" fill="#f4f1ea">Yardstick</text>
  <text x="100" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#b5ada0">Measure a yard with a phone. Know how far to trust it.</text>
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="100" y="256" width="148" height="28" rx="6" fill="#f5b342" fill-opacity=".12" stroke="#f5b342" stroke-opacity=".6"/>
    <text x="174" y="275" text-anchor="middle" fill="#f5b342">iPHONE LiDAR</text>
    <rect x="258" y="256" width="168" height="28" rx="6" fill="#f5b342" fill-opacity=".12" stroke="#f5b342" stroke-opacity=".6"/>
    <text x="342" y="275" text-anchor="middle" fill="#f5b342">8 ArUco MARKERS</text>
    <rect x="436" y="256" width="192" height="28" rx="6" fill="#3fd0b0" fill-opacity=".12" stroke="#3fd0b0" stroke-opacity=".6"/>
    <text x="532" y="275" text-anchor="middle" fill="#3fd0b0">95% TOLERANCE</text>
    <rect x="638" y="256" width="116" height="28" rx="6" fill="#b5ada0" fill-opacity=".10" stroke="#b5ada0" stroke-opacity=".5"/>
    <text x="696" y="275" text-anchor="middle" fill="#b5ada0">APACHE-2.0</text>
  </g>
  <!-- the yardstick ruler -->
  <g transform="translate(96 318)">
    <rect x="0" y="0" width="1088" height="44" rx="6" fill="#f5b342"/>
    <g stroke="#141210" stroke-width="2">
      <path d="M34 0V22M68 0V14M102 0V14M136 0V30M170 0V14M204 0V14M238 0V22M272 0V30M306 0V14M340 0V14M374 0V22M408 0V30M442 0V14M476 0V14M510 0V22M544 0V30M578 0V14M612 0V14M646 0V22M680 0V30M714 0V14M748 0V14M782 0V22M816 0V30M850 0V14M884 0V14M918 0V22M952 0V30M986 0V14M1020 0V14M1054 0V22"/>
    </g>
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#141210">
      <text x="136" y="40" text-anchor="middle">1 m</text><text x="272" y="40" text-anchor="middle">2 m</text>
      <text x="408" y="40" text-anchor="middle">3 m</text><text x="544" y="40" text-anchor="middle">4 m</text>
      <text x="680" y="40" text-anchor="middle">5 m</text><text x="816" y="40" text-anchor="middle">6 m</text>
      <text x="952" y="40" text-anchor="middle">7 m</text>
    </g>
  </g>
  <!-- an ArUco-style marker glyph -->
  <g transform="translate(968 64)">
    <rect x="0" y="0" width="196" height="196" fill="#f4f1ea"/>
    <rect x="14" y="14" width="168" height="168" fill="#141210"/>
    <g fill="#f4f1ea">
      <rect x="38" y="38" width="24" height="24"/><rect x="86" y="38" width="24" height="24"/><rect x="110" y="38" width="24" height="24"/>
      <rect x="62" y="62" width="24" height="24"/><rect x="134" y="62" width="24" height="24"/>
      <rect x="38" y="86" width="24" height="24"/><rect x="86" y="86" width="24" height="24"/>
      <rect x="62" y="110" width="24" height="24"/><rect x="110" y="110" width="24" height="24"/><rect x="134" y="110" width="24" height="24"/>
      <rect x="38" y="134" width="24" height="24"/><rect x="86" y="134" width="24" height="24"/>
    </g>
  </g>
</svg>
