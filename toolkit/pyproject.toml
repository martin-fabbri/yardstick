[project]
name = "yardstick"
version = "0.1.0"
description = "Yardstick laptop validator, converter, grader, and synthetic capture toolkit (yardstick-capture/1)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Martin Fabbri", email = "martin-fabbri@users.noreply.github.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "opencv-contrib-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "jsonschema>=4.21.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
yardstick = "yardstick.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yardstick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
